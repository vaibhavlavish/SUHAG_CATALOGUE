<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suhag Jewellers — Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --oxblood:#3B0E17; --oxblood-deep:#2A0A10; --gold:#C6A15B; --gold-soft:#E7C9A9;
    --ivory:#FBF6EE; --ink:#2A2420; --ink-soft:#6b6058;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ivory); color:var(--ink);
    font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Cormorant Garamond', serif;}

  header{
    background:linear-gradient(180deg, var(--oxblood) 0%, var(--oxblood-deep) 100%);
    color:var(--ivory); padding:22px 20px 26px; position:relative; overflow:hidden;
  }
  header::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 85% -10%, rgba(198,161,91,.18), transparent 45%),
               radial-gradient(circle at 5% 110%, rgba(198,161,91,.12), transparent 40%);
    pointer-events:none;
  }
  .shop-row{display:flex; align-items:center; justify-content:space-between; gap:10px; position:relative;}
  .shop-name{font-size:26px; font-weight:600; letter-spacing:.3px; margin:0; cursor:pointer; display:inline-block;}
  .shop-name:active{opacity:.75;}
  .shop-name em{color:var(--gold); font-style:normal;}
  .tagline{margin:4px 0 0; font-size:13px; color:var(--gold-soft);}

  .toolbar{background:var(--ivory); padding:12px 16px 10px; position:sticky; top:0; z-index:5; box-shadow:0 6px 14px -10px rgba(0,0,0,.25);}
  .category-slider{display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch; padding:2px 0;}
  .category-slider::-webkit-scrollbar{display:none;}
  .category-chip{
    flex:0 0 auto; padding:8px 16px; border-radius:999px; border:1.5px solid #E6DCCB;
    background:#fff; color:var(--ink-soft); font-family:'Work Sans',sans-serif; font-size:13px; font-weight:600;
    white-space:nowrap; cursor:pointer;
  }
  .category-chip.active{background:var(--oxblood); border-color:var(--oxblood); color:var(--ivory);}

  main{padding:16px 16px 40px; max-width:920px; margin:0 auto;}
  .grid{display:grid; grid-template-columns: 1fr; gap:18px;}
  @media (min-width:700px){
    .grid{grid-template-columns: repeat(3, 1fr); gap:18px;}
  }
  .card{
    background:#fff; border:1px solid #EEE3CC; border-radius:14px; overflow:hidden;
    opacity:0; transform:translateY(10px); animation:riseIn .5s ease forwards; cursor:pointer;
  }
  @keyframes riseIn{to{opacity:1; transform:translateY(0);}}
  .card-photo{aspect-ratio:1/1; background:#F0EAD9; position:relative; overflow:hidden;}
  .card-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-photo .tag{
    position:absolute; left:8px; bottom:8px; font-size:11.5px; letter-spacing:.3px;
    color:var(--ink-soft); background:rgba(255,255,255,.85); padding:3px 8px; border-radius:6px;
  }

  .state-msg{text-align:center; color:var(--ink-soft); font-size:13.5px; padding:60px 20px;}
  .state-msg.hide{display:none;}

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(20,8,10,.94); z-index:40;
    display:flex; align-items:flex-start; justify-content:center; overflow-y:auto;
    padding:60px 16px 40px;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .lightbox.open{opacity:1; pointer-events:auto;}
  .lightbox-close{
    position:fixed; top:18px; right:18px; width:38px; height:38px; border-radius:50%;
    border:none; background:rgba(255,255,255,.12); color:#fff; font-size:18px; cursor:pointer; z-index:2;
  }

  .lightbox-content{
    width:min(92vw, 900px); margin:auto;
    display:flex; flex-direction:column; gap:16px;
  }
  @media (min-width:720px){
    .lightbox-content{ flex-direction:row; align-items:center; gap:26px; }
  }

  .lightbox-photo-wrap{ position:relative; flex:0 0 auto; margin:0 auto; width:min(88vw, 420px); }
  @media (min-width:720px){ .lightbox-photo-wrap{ width:420px; margin:0; } }

  .lightbox-photo{
    width:100%; aspect-ratio:1/1; border-radius:10px;
    background:#F0EAD9; overflow:hidden; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-photo img{width:100%; height:100%; object-fit:contain; display:block;}
  .lightbox-tag{
    position:absolute; top:8px; left:8px; z-index:2;
    color:#fff; background:rgba(0,0,0,.45); font-size:11px; letter-spacing:.4px;
    padding:3px 8px; border-radius:6px;
  }

  .lightbox-nav{ position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; padding:0 8px; pointer-events:none; }
  .lb-arrow{
    pointer-events:auto; width:36px; height:36px; border-radius:50%; border:none;
    background:rgba(20,8,10,.55); color:#fff; font-size:20px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .lb-arrow:active{ transform:scale(.92); }

  .lb-dots{ display:flex; justify-content:center; gap:6px; margin-top:10px; }
  .lb-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.35); }
  .lb-dot.active{ background:var(--gold); }

  .lightbox-details{
    background:#fff; border-radius:14px; padding:20px 22px 22px; text-align:left;
    width:min(88vw, 420px); margin:0 auto;
  }
  @media (min-width:720px){ .lightbox-details{ width:280px; margin:0; } }
  .lb-name{ font-size:22px; font-weight:600; color:var(--ink); margin:0 0 8px; line-height:1.25; }
  .lb-size-row{ font-size:13.5px; color:var(--ink-soft); margin:0 0 14px; }
  .lb-size-row b{ color:var(--ink); font-weight:700; }
  .lb-price{ font-size:25px; font-weight:800; color:#2E7D46; margin:0 0 18px; }
  .lb-whatsapp-btn{
    display:block; text-align:center; text-decoration:none; border-radius:11px; padding:12px 0;
    background:var(--oxblood); color:var(--ivory); font-weight:700; font-size:14px;
    font-family:'Work Sans',sans-serif;
  }
  .lb-whatsapp-btn:active{ transform:scale(.98); }
  .lb-share-btn{
    display:block; width:100%; text-align:center; border-radius:11px; padding:11px 0; margin-top:10px;
    background:none; border:1.5px solid #E6DCCB; color:var(--ink); font-weight:700; font-size:13.5px;
    font-family:'Work Sans',sans-serif; cursor:pointer;
  }
  .lb-share-btn:active{ transform:scale(.98); }

  /* ---------- Home view (banners) ---------- */
  .view-hidden{display:none !important;}
  .home-banners{
    padding:18px 16px 40px; max-width:920px; margin:0 auto;
    display:flex; flex-wrap:wrap; justify-content:center; gap:18px;
  }
  .home-banner{
    position:relative; border-radius:16px; overflow:hidden; aspect-ratio:4/3; cursor:pointer;
    background:#F0EAD9; opacity:0; transform:translateY(10px); animation:riseIn .5s ease forwards;
    flex:1 1 320px; max-width:420px;
  }
  .home-banner img{width:100%; height:100%; object-fit:cover; display:block;}

  @media (prefers-reduced-motion: reduce){ .card{animation:none; opacity:1; transform:none;} .home-banner{animation:none; opacity:1; transform:none;} }

  /* ---------- Google Reviews (read-only, pulled live from your Business Profile) ---------- */
  .reviews-section{ max-width:920px; margin:0 auto; padding:36px 16px 30px; border-top:1px solid #EAE0CB; text-align:center; }
  .reviews-heading{ font-size:24px; font-weight:600; margin:0 0 10px; }
  .reviews-summary{ font-size:13.5px; color:var(--ink-soft); margin-bottom:20px; }
  .reviews-summary .stars{ color:var(--gold); letter-spacing:1px; margin-right:4px; }
  .reviews-scroll{
    display:flex; gap:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity;
    padding:2px 2px 10px; margin-bottom:18px;
  }
  .review-card{
    flex:0 0 auto; width:260px; scroll-snap-align:start; background:#fff; border:1px solid #EEE3CC;
    border-radius:14px; padding:16px; text-align:left;
  }
  .review-card .who-row{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .review-card .avatar{ width:34px; height:34px; border-radius:50%; object-fit:cover; background:#F0EAD9; flex-shrink:0; }
  .review-card .who-name{ font-size:13px; font-weight:700; color:var(--ink); }
  .review-card .when{ font-size:11px; color:var(--ink-soft); }
  .review-card .stars{ color:var(--gold); letter-spacing:1px; font-size:13px; margin-bottom:6px; display:block; }
  .review-card .text{ font-size:13px; color:var(--ink); line-height:1.5; margin:0; }
  .no-reviews-msg{ font-size:13px; color:var(--ink-soft); padding:20px 0; }
  .reviews-btn-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .see-all-reviews-link{
    display:inline-block; text-decoration:none; border:1.5px solid var(--oxblood); color:var(--oxblood);
    border-radius:11px; padding:11px 22px; font-weight:700; font-size:13.5px; font-family:'Work Sans',sans-serif;
  }
  .write-review-link{
    display:inline-block; text-decoration:none; background:var(--oxblood); color:var(--ivory);
    border-radius:11px; padding:11px 22px; font-weight:700; font-size:13.5px; font-family:'Work Sans',sans-serif;
  }
</style>
</head>
<body>

<header>
  <div class="shop-row">
    <div>
      <p class="shop-name display" id="home-link" role="button" tabindex="0"><em>Suhag</em> Jewellers</p>
      <p class="tagline">Browse the collection &middot; whatsapp us to order</p>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="category-slider" id="category-slider"></div>
</div>

<div id="home-view">
  <div class="home-banners" id="home-banners"></div>
</div>

<div id="browse-view" class="view-hidden">
  <main>
    <div class="grid" id="grid"></div>
    <p class="state-msg hide" id="empty-msg">No pieces in this category right now — try another, or message us directly.</p>
    <p class="state-msg" id="loading-msg">Loading the collection…</p>
  </main>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <div class="lightbox-content" id="lightbox-content">
    <div class="lightbox-photo-wrap">
      <span class="lightbox-tag" id="lightbox-tag"></span>
      <div class="lightbox-photo" id="lightbox-photo"></div>
      <div class="lightbox-nav" id="lightbox-nav">
        <button class="lb-arrow lb-prev" id="lightbox-prev" aria-label="Previous photo">‹</button>
        <button class="lb-arrow lb-next" id="lightbox-next" aria-label="Next photo">›</button>
      </div>
      <div class="lb-dots" id="lightbox-dots"></div>
    </div>
    <div class="lightbox-details">
      <p class="lb-name display" id="lightbox-item-name"></p>
      <p class="lb-size-row" id="lightbox-size-row">Size: <b id="lightbox-size"></b></p>
      <p class="lb-price" id="lightbox-price"></p>
      <a class="lb-whatsapp-btn" id="lightbox-whatsapp" target="_blank" rel="noopener">💬 Order this piece on WhatsApp</a>
      <button class="lb-share-btn" id="lightbox-share" type="button">🔗 Share This Piece</button>
    </div>
  </div>
</div>

<div class="reviews-section">
  <p class="reviews-heading display">What Our Customers Say</p>
  <div class="reviews-summary" id="reviews-summary"></div>
  <div class="reviews-scroll" id="reviews-scroll"><p class="no-reviews-msg">Loading reviews…</p></div>
  <div class="reviews-btn-row">
    <a class="write-review-link" id="write-review-link" href="#" target="_blank" rel="noopener">✍️ Write a Review</a>
    <a class="see-all-reviews-link" id="see-all-reviews-link" href="#" target="_blank" rel="noopener">See all reviews on Google</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// Same Firebase project as the main POS app. This page reads ONLY
// `catalogue/items` — including the displayName/displaySize/displayPrice
// fields the POS app precomputes and pushes there whenever stock or rates
// change. It deliberately never reads `jewelryData` directly: the raw
// weight/rate/making-charge numbers that go into a price are never sent to
// this public page, only the finished result. No write access either way.
// (Reviews come from the Google Places API separately, not Firebase.)
const firebaseConfig = {
  apiKey: "AIzaSyDaRjbdCnfx5-C4OXQaByZMxK2r0Cu19bI",
  authDomain: "suhag-f53e4.firebaseapp.com",
  databaseURL: "https://suhag-f53e4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "suhag-f53e4",
  storageBucket: "suhag-f53e4.firebasestorage.app",
  messagingSenderId: "231258063675",
  appId: "1:231258063675:web:1c79c2a0d4d5796a6d2d1e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Single source of truth for the shop's WhatsApp number — used by the
// per-item "Order this piece" button in the lightbox.
const SHOP_WHATSAPP_NUMBER = '919327647044';

let ALL_ITEMS = [];      // [{ barcode, images:[url,...], uploadedAt, categoryKey, displayName, size, price }]
let ACTIVE_CATEGORY = 'All';
let HOME_BANNERS = [];   // [{ id, imageUrl, categoryKey }], ordered
let CURRENT_VIEW = 'home';

function categoryKey(name){
  return (name || '').toString().trim().toLowerCase();
}
function categoryLabel(key){
  if (!key) return 'Other';
  return key.replace(/\s+/g, ' ').split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function formatPrice(n){
  return '₹' + Math.round(n).toLocaleString('en-IN');
}

// Combines the new multi-photo format (images/{id} = {imageUrl, hiddenAt?})
// with the older single-photo format (flat imageUrl on the barcode node),
// oldest-first, skipping any photo the shop has hidden.
function collectImages(node){
  const entries = [];
  const images = (node && node.images) || {};
  Object.keys(images).forEach(id => {
    const img = images[id];
    if (!img || !img.imageUrl || img.hiddenAt) return;
    entries.push({ url: img.imageUrl, t: img.uploadedAt || 0 });
  });
  if (node && node.imageUrl) entries.push({ url: node.imageUrl, t: node.uploadedAt || 0 });
  entries.sort((a, b) => a.t - b.t);
  return entries;
}

function renderCategorySlider(){
  const keys = Array.from(new Set(ALL_ITEMS.map(i => i.categoryKey))).sort((a, b) => categoryLabel(a).localeCompare(categoryLabel(b)));
  const slider = document.getElementById('category-slider');
  const chips = ['All', ...keys];
  slider.innerHTML = chips.map(key => {
    const label = key === 'All' ? 'All' : categoryLabel(key);
    const active = key === ACTIVE_CATEGORY ? ' active' : '';
    return `<button class="category-chip${active}" data-key="${key === 'All' ? 'All' : key.replace(/"/g,'&quot;')}">${label}</button>`;
  }).join('');

  slider.querySelectorAll('.category-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      ACTIVE_CATEGORY = chip.dataset.key;
      goToView('browse');
      renderCategorySlider();
      renderGrid();
    });
  });
}

function renderGrid(){
  const items = ACTIVE_CATEGORY === 'All' ? ALL_ITEMS : ALL_ITEMS.filter(i => i.categoryKey === ACTIVE_CATEGORY);

  const grid = document.getElementById('grid');
  grid.innerHTML = items.map((item, i) => `
    <div class="card" style="animation-delay:${Math.min(i*0.03,0.6)}s" data-barcode="${item.barcode}">
      <div class="card-photo">
        <img src="${item.images[0]}" alt="" loading="lazy">
        <span class="tag">${item.barcode}</span>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const item = ALL_ITEMS.find(i => i.barcode === card.dataset.barcode);
      if (item) openLightbox(item);
    });
  });

  document.getElementById('empty-msg').classList.toggle('hide', items.length > 0);
}

let currentLightboxItem = null;
let currentImageIndex = 0;

// Pure DOM population — no history side effects. Used both for genuine user
// taps (via openLightbox below) and when popstate reopens the popup after
// the user navigates forward again.
function openLightboxDom(item){
  currentLightboxItem = item;
  currentImageIndex = 0;
  renderLightboxImage();

  document.getElementById('lightbox-item-name').textContent = item.displayName || 'Jewellery item';
  document.getElementById('lightbox-tag').textContent = item.barcode;

  const sizeRow = document.getElementById('lightbox-size-row');
  if (item.size) {
    sizeRow.style.display = '';
    document.getElementById('lightbox-size').textContent = item.size;
  } else {
    sizeRow.style.display = 'none';
  }

  document.getElementById('lightbox-price').textContent =
    item.price != null ? formatPrice(item.price) : 'Price on request';

  document.getElementById('lightbox-whatsapp').href = buildWhatsAppLink(item);
  document.getElementById('lightbox').dataset.shareUrl = buildItemShareUrl(item);

  document.getElementById('lightbox').classList.add('open');
}

// User tapped a photo — opens the popup AND records a history entry, so the
// phone/browser back button closes the popup instead of leaving the site.
function openLightbox(item){
  openLightboxDom(item);
  history.pushState({ screen: 'lightbox', category: ACTIVE_CATEGORY, barcode: item.barcode }, '', location.pathname);
}

function renderLightboxImage(){
  const item = currentLightboxItem;
  if (!item) return;
  document.getElementById('lightbox-photo').innerHTML = `<img src="${item.images[currentImageIndex]}" alt="">`;

  const hasMultiple = item.images.length > 1;
  document.getElementById('lightbox-nav').style.display = hasMultiple ? 'flex' : 'none';
  document.getElementById('lightbox-dots').innerHTML = hasMultiple
    ? item.images.map((_, i) => `<span class="lb-dot${i === currentImageIndex ? ' active' : ''}"></span>`).join('')
    : '';
}

function shiftLightboxImage(delta){
  if (!currentLightboxItem) return;
  const n = currentLightboxItem.images.length;
  currentImageIndex = (currentImageIndex + delta + n) % n;
  renderLightboxImage();
}

function buildWhatsAppLink(item){
  const lines = [
    "Hi! I'm interested in this piece:",
    `Item: ${item.displayName || 'Jewellery item'}`,
    `Tag No: ${item.barcode}`,
    `Price: ${item.price != null ? formatPrice(item.price) : 'please confirm'}`,
    '',
    'Is it available?'
  ];
  return 'https://wa.me/' + SHOP_WHATSAPP_NUMBER + '?text=' + encodeURIComponent(lines.join('\n'));
}

// Deep link straight back to this exact item — the catalogKey is the stable
// photo-group identifier, so this keeps working even if a linked tag sells
// and a different tag in the same group becomes the one that's active.
function buildItemShareUrl(item){
  return location.origin + location.pathname + '?item=' + encodeURIComponent(item.catalogKey);
}

document.getElementById('lightbox-share').addEventListener('click', async () => {
  const btn = document.getElementById('lightbox-share');
  const url = document.getElementById('lightbox').dataset.shareUrl;
  const item = currentLightboxItem;
  const title = (item && item.displayName) ? item.displayName : 'Suhag Jewellers';

  // On phones this opens the native share sheet (Instagram, WhatsApp,
  // Messages, etc. all in one) — far better than a plain copied link.
  // Desktop browsers mostly don't support it, so fall back to clipboard.
  if (navigator.share) {
    try { await navigator.share({ title, url }); }
    catch (e) { /* user cancelled the share sheet — not an error */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    const original = btn.textContent;
    btn.textContent = '✓ Link copied!';
    setTimeout(() => { btn.textContent = original; }, 1800);
  } catch (e) {
    prompt('Copy this link:', url);
  }
});

function closeLightboxDom(){ document.getElementById('lightbox').classList.remove('open'); }
function closeLightbox(){
  // If we got here via a real lightbox history entry, popping it triggers
  // popstate, which does the actual DOM close — keeping "tap X" and "tap
  // back" perfectly equivalent. If there's no such entry (e.g. lightbox
  // was reopened directly with no matching state, or history is otherwise
  // out of sync), just close directly rather than risk leaving the site.
  if (history.state && history.state.screen === 'lightbox') {
    history.back();
  } else {
    closeLightboxDom();
  }
}
document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
document.getElementById('lightbox-prev').addEventListener('click', e => { e.stopPropagation(); shiftLightboxImage(-1); });
document.getElementById('lightbox-next').addEventListener('click', e => { e.stopPropagation(); shiftLightboxImage(1); });
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') shiftLightboxImage(-1);
  else if (e.key === 'ArrowRight') shiftLightboxImage(1);
  else if (e.key === 'Escape') closeLightbox();
});

// Basic swipe support for the photo on touch devices.
(function enableSwipe(){
  const photo = document.getElementById('lightbox-photo');
  let startX = null;
  photo.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
  photo.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) shiftLightboxImage(dx < 0 ? 1 : -1);
    startX = null;
  }, { passive: true });
})();

function rebuildItems(catalogueData){
  // A barcode is shown once the shop marks it available AND it has at least
  // one visible photo, in either the multi-photo or the older single-photo format.
  const barcodes = Object.keys(catalogueData).filter(bc => {
    const node = catalogueData[bc];
    return node && node.available && collectImages(node).length > 0;
  });

  ALL_ITEMS = barcodes
    .map(bc => {
      const node = catalogueData[bc];
      const imgEntries = collectImages(node);
      const displayName = node.displayName || '';
      const newestImageAt = imgEntries.reduce((max, e) => Math.max(max, e.t || 0), 0);

      return {
        barcode: node.activeBarcode || bc,
        catalogKey: bc, // stable identifier for deep links — doesn't change even if a linked group's active tag does
        images: imgEntries.map(e => e.url),
        uploadedAt: node.uploadedAt || newestImageAt || 0,
        categoryKey: categoryKey(displayName),
        displayName,
        size: node.displaySize || '',
        price: (typeof node.displayPrice === 'number') ? node.displayPrice : null,
      };
    })
    .sort((a, b) => b.uploadedAt - a.uploadedAt); // newest arrivals first

  // If the category the customer currently has selected no longer has any
  // items in it, fall back to "All" rather than showing an empty screen.
  if (ACTIVE_CATEGORY !== 'All' && !ALL_ITEMS.some(i => i.categoryKey === ACTIVE_CATEGORY)) {
    ACTIVE_CATEGORY = 'All';
  }

  document.getElementById('loading-msg').classList.add('hide');
  renderCategorySlider();
  renderGrid();
}

// ---------- Home view ----------
// Attractive banner tiles set up in the Upload Terminal's "Home Page" tab.
// Each banner opens the browse view pre-filtered to whichever category the
// shop assigned it. If a banner's category no longer has any live items
// (e.g. everything in it sold), browse view just shows the normal "no
// pieces right now" empty state for that category rather than looking broken.
function renderHomeBanners(){
  const wrap = document.getElementById('home-banners');
  wrap.innerHTML = HOME_BANNERS.map((b, i) => `
    <div class="home-banner" style="animation-delay:${Math.min(i*0.05,0.4)}s" data-idx="${i}">
      <img src="${b.imageUrl}" alt="">
    </div>
  `).join('');

  wrap.querySelectorAll('.home-banner').forEach(el => {
    el.addEventListener('click', () => {
      const banner = HOME_BANNERS[Number(el.dataset.idx)];
      if (!banner) return;

      if (banner.itemBarcode) {
        const item = ALL_ITEMS.find(i => i.catalogKey.toUpperCase() === banner.itemBarcode.toUpperCase());
        if (item) {
          ACTIVE_CATEGORY = item.categoryKey;
          goToView('browse');
          renderCategorySlider();
          renderGrid();
          openLightbox(item);
          return;
        }
        // Item no longer exists (sold with no replacement, deleted, etc.) —
        // fall through to a plain "All" browse rather than doing nothing.
      }

      ACTIVE_CATEGORY = (banner.categoryKey === 'all' || !banner.categoryKey) ? 'All' : banner.categoryKey;
      goToView('browse');
      renderCategorySlider();
      renderGrid();
    });
  });
}

function applyView(name){
  // No banners set up yet? Don't show an empty home screen — just go
  // straight to the full catalogue so day-one use (before any banners
  // exist) never looks broken.
  if (name === 'home' && !HOME_BANNERS.length) name = 'browse';
  CURRENT_VIEW = name;
  document.getElementById('home-view').classList.toggle('view-hidden', name !== 'home');
  document.getElementById('browse-view').classList.toggle('view-hidden', name !== 'browse');
  return name; // the (possibly coerced) view actually applied
}

// User-initiated navigation (logo tap, category tap, banner tap) — applies
// the view AND records a history entry, so phone/browser back steps
// backward through the catalogue instead of leaving the site entirely.
function goToView(name){
  const applied = applyView(name);
  history.pushState({ screen: applied, category: ACTIVE_CATEGORY }, '', location.pathname);
}

document.getElementById('home-link').addEventListener('click', () => goToView('home'));

window.addEventListener('popstate', e => {
  const state = e.state || { screen: 'home' };
  if (state.screen === 'lightbox') {
    ACTIVE_CATEGORY = state.category || 'All';
    applyView('browse');
    renderCategorySlider();
    renderGrid();
    const item = ALL_ITEMS.find(i => i.barcode === state.barcode);
    if (item) openLightboxDom(item); else closeLightboxDom();
  } else if (state.screen === 'browse') {
    closeLightboxDom();
    ACTIVE_CATEGORY = state.category || 'All';
    applyView('browse');
    renderCategorySlider();
    renderGrid();
  } else {
    closeLightboxDom();
    applyView('home');
  }
});

// Live listeners — reflect sales, new arrivals, rate changes, and home
// banner edits as they happen, no refresh needed.
let itemsFirstLoadDone = false;
let bannersFirstLoadDone = false;
let initialViewDecided = false;

onValue(ref(db, 'catalogue/items'), snap => {
  rebuildItems(snap.val() || {});
  itemsFirstLoadDone = true;
  maybeDecideInitialView();
}, err => {
  document.getElementById('loading-msg').textContent = 'Could not load the collection right now.';
  console.error(err);
  itemsFirstLoadDone = true;
  maybeDecideInitialView();
});

onValue(ref(db, 'catalogue/homeBanners'), snap => {
  const val = snap.val() || {};
  HOME_BANNERS = Object.keys(val)
    .map(id => ({
      id,
      imageUrl: val[id].imageUrl,
      categoryKey: val[id].categoryKey || 'all',
      itemBarcode: val[id].itemBarcode || null,
      order: val[id].order || 0,
    }))
    .sort((a, b) => a.order - b.order);
  renderHomeBanners();
  bannersFirstLoadDone = true;
  if (!maybeDecideInitialView() && initialViewDecided && CURRENT_VIEW === 'home' && !HOME_BANNERS.length) {
    // Shop just removed their last banner while a customer was sitting on
    // the home view — fall back gracefully instead of showing it empty.
    applyView('browse');
  }
}, err => console.error(err));

// Deciding the initial screen needs BOTH catalogue items (to resolve a
// shared ?item= link to an actual product) and home banners (to know
// whether "home" is even a real destination) to have loaded at least once.
// Runs exactly once; returns true if it actually made the decision this call.
function maybeDecideInitialView(){
  if (initialViewDecided || !itemsFirstLoadDone || !bannersFirstLoadDone) return false;
  initialViewDecided = true;

  // Shareable deep links: ?item=<barcode> opens straight into one product's
  // photo popup (for Instagram/WhatsApp links to one specific piece);
  // ?category=<name> opens browsing pre-filtered to that category. Both use
  // replaceState for this first entry — arriving via a shared link is the
  // start of the session, same as any normal page load; back should still
  // be free to leave the site from here, not get stuck retracing the deep link.
  const params = new URLSearchParams(location.search);
  const itemParam = params.get('item');
  const categoryParam = params.get('category');

  if (itemParam) {
    const item = ALL_ITEMS.find(i => i.catalogKey.toUpperCase() === itemParam.toUpperCase());
    if (item) {
      ACTIVE_CATEGORY = item.categoryKey;
      applyView('browse');
      renderCategorySlider();
      renderGrid();
      history.replaceState({ screen: 'browse', category: ACTIVE_CATEGORY }, '', location.pathname);
      openLightboxDom(item);
      history.pushState({ screen: 'lightbox', category: ACTIVE_CATEGORY, barcode: item.barcode }, '', location.pathname);
      return true;
    }
    // Item not found (sold with nothing left in its group, deleted, typo in
    // the shared link, etc.) — fall through to category/default below
    // rather than showing a broken or blank page.
  }

  if (categoryParam) {
    const key = categoryParam.toLowerCase();
    ACTIVE_CATEGORY = ALL_ITEMS.some(i => i.categoryKey === key) ? key : 'All';
    applyView('browse');
    renderCategorySlider();
    renderGrid();
    history.replaceState({ screen: 'browse', category: ACTIVE_CATEGORY }, '', location.pathname);
    return true;
  }

  const applied = applyView('home');
  history.replaceState({ screen: applied, category: ACTIVE_CATEGORY }, '', location.pathname);
  return true;
}

// ---------- Google Reviews (live, from your actual Business Profile) ----------
// Fill these two in once your Google Cloud setup is ready (see the guide
// alongside this file). Google's API caps this at the 5 "most relevant"
// reviews (its choice, not configurable) and never exposes photos a
// reviewer attached to their review — only their small Google account
// avatar — that's a hard limitation of Google's API, not something
// fixable here. "See all reviews on Google" covers the rest.
const GOOGLE_MAPS_API_KEY = 'AIzaSyCBfJRhcD8Oas3gAX_mm1QQFQRrWiU_0So';
const GOOGLE_PLACE_ID = 'ChIJoSJ1hJnt4DsRPnyWFI1nR4A';

// Google's own official "write a review" link for a specific place — takes
// the customer to Google's real review form (their account, their rules),
// tied to this exact Place ID, so it can only ever land on this listing.
// This is deliberately NOT a custom form: only someone signed into a real
// Google account can post through it, same as any review on Google Maps.
if (!GOOGLE_PLACE_ID.startsWith('YOUR_')) {
  document.getElementById('write-review-link').href =
    'https://search.google.com/local/writereview?placeid=' + GOOGLE_PLACE_ID;
}

// Google gives no way to pick which of its reviews show — this hidden-list
// is our own layer on top, managed from the Upload Terminal. Each review's
// own `time` field (a stable per-review timestamp Google assigns) is the key.
let HIDDEN_REVIEW_TIMES = new Set();
let LAST_FETCHED_PLACE = null;
let hiddenListLoaded = false;

onValue(ref(db, 'catalogue/hiddenGoogleReviews'), snap => {
  const val = snap.val() || {};
  HIDDEN_REVIEW_TIMES = new Set(Object.keys(val).filter(k => val[k]));
  hiddenListLoaded = true;
  if (LAST_FETCHED_PLACE) renderGoogleReviews(LAST_FETCHED_PLACE);
}, err => console.error(err));

function renderStars(n){
  return '★★★★★☆☆☆☆☆'.slice(5 - n, 10 - n);
}
function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function loadGoogleReviews(){
  if (GOOGLE_MAPS_API_KEY.startsWith('YOUR_') || GOOGLE_PLACE_ID.startsWith('YOUR_')) {
    document.getElementById('reviews-scroll').innerHTML =
      '<p class="no-reviews-msg">Google Reviews aren\'t connected yet — add your API key and Place ID.</p>';
    document.getElementById('see-all-reviews-link').style.display = 'none';
    return;
  }
  window.__initGoogleReviews = fetchGoogleReviews;
  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&callback=__initGoogleReviews`;
  script.async = true;
  script.onerror = () => {
    document.getElementById('reviews-scroll').innerHTML = '<p class="no-reviews-msg">Could not load reviews right now.</p>';
  };
  document.head.appendChild(script);
}

function fetchGoogleReviews(){
  const service = new google.maps.places.PlacesService(document.createElement('div'));
  service.getDetails(
    { placeId: GOOGLE_PLACE_ID, fields: ['name', 'rating', 'user_ratings_total', 'reviews', 'url'] },
    (place, status) => {
      if (status !== google.maps.places.PlacesServiceStatus.OK || !place) {
        document.getElementById('reviews-scroll').innerHTML = '<p class="no-reviews-msg">Could not load reviews right now.</p>';
        return;
      }
      LAST_FETCHED_PLACE = place;
      renderGoogleReviews(place);
    }
  );
}

function renderGoogleReviews(place){
  const summary = document.getElementById('reviews-summary');
  const scroll = document.getElementById('reviews-scroll');
  const link = document.getElementById('see-all-reviews-link');

  if (place.url) link.href = place.url;

  if (typeof place.rating === 'number') {
    summary.innerHTML = `<span class="stars">${renderStars(Math.round(place.rating))}</span>${place.rating.toFixed(1)} out of 5 · ${place.user_ratings_total || 0} review${place.user_ratings_total === 1 ? '' : 's'} on Google`;
  }

  // Only filter once we actually know the hidden list (avoids a flash of
  // "no reviews" before Firebase has responded even once).
  const allReviews = place.reviews || [];
  const reviews = hiddenListLoaded
    ? allReviews.filter(r => !HIDDEN_REVIEW_TIMES.has(String(r.time)))
    : allReviews;

  if (!reviews.length) {
    scroll.innerHTML = '<p class="no-reviews-msg">No reviews yet on Google.</p>';
    return;
  }

  scroll.innerHTML = reviews.map(r => `
    <div class="review-card">
      <div class="who-row">
        <img class="avatar" src="${r.profile_photo_url || ''}" alt="">
        <div>
          <div class="who-name">${escapeHtml(r.author_name || 'Google user')}</div>
          <div class="when">${escapeHtml(r.relative_time_description || '')}</div>
        </div>
      </div>
      <span class="stars">${renderStars(r.rating || 0)}</span>
      <p class="text">${escapeHtml(r.text || '')}</p>
    </div>
  `).join('');
}

loadGoogleReviews();
</script>
